<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YDE Thunder | Hockey Tracker</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#122638;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}header{background:#092c48;color:white;padding:18px max(16px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:10px}header b{font-size:22px}header small{display:block;color:#a9cce0}.team-switch{display:flex;gap:6px;padding:7px;background:#dceaf3;border-radius:13px;margin-bottom:15px}.team-switch button{flex:1;font-size:17px}.team-switch button.active{background:#092c48;color:white}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;font-weight:700;background:#dbe8f0;color:#14364c}button.primary{background:#0782c4;color:white}button.danger{background:#fee2e2;color:#9a1c1c}button:disabled{opacity:.4;cursor:not-allowed}main{max-width:1100px;margin:auto;padding:18px}nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}nav button.active{background:#092c48;color:white}.panel{background:white;border-radius:15px;padding:18px;margin-bottom:16px;box-shadow:0 2px 14px #19354b0c}h2{margin:0 0 14px;font-size:20px}h3{margin:8px 0}p.muted,.muted{color:#657b8d}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:white;padding:16px;border-radius:13px}.metric strong{display:block;font-size:28px;color:#075c8b}.metric span{font-size:13px;color:#61798b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.game{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #e8eef2;padding:14px 0}.game:last-child{border:0}.game strong{display:block}.game small{color:#61798b}.tag{display:inline-block;background:#e7f2fa;color:#075c8b;padding:4px 8px;border-radius:8px;font-size:12px;font-weight:700}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.controls>*{flex:1;min-width:130px}select,input{border:1px solid #cad9e4;border-radius:10px;padding:11px;background:white;max-width:100%}label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}.field{margin-bottom:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:11px;text-align:left;border-bottom:1px solid #e8eef2;white-space:nowrap}th{color:#5b7385;font-size:12px}tr:hover{background:#f7fafc}.score{font-size:30px;font-weight:800;text-align:center;margin:14px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{padding:18px 8px;background:#eaf4fa}.quick button b{display:block;font-size:21px}.status{font-size:13px;color:#49697e}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.notice{background:#fff6dc;padding:11px;border-radius:10px;color:#76531b;font-size:13px}.event{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #e8eef2;font-size:14px}.hide{display:none!important}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}header b{font-size:18px}.panel{padding:14px}.game{align-items:flex-start}.game button{padding:9px}.quick{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div><b>⚡ YDE THUNDER</b><small><span id="teamLabel">JV</span> Hockey • 2026–27 Season</small></div><button onclick="exportExcel()">⬇ Export Excel</button></header><main><div class="team-switch"><button id="jvSwitch" onclick="switchTeam('JV')">JV</button><button id="varsitySwitch" onclick="switchTeam('Varsity')">Varsity</button></div><nav id="tabs"></nav><section id="view"></section></main><script>
const jvRoster=[['Arthur Aizer',10,30,'G'],['Jack Bawabeh',10,26],['Joseph Cheika',9,6],['Mikey Cohen',10,19],['Elliot Dweck',10,23],['Joseph Dweck',10,24],['Steven Elbaz',10,9],['Shaya Fallas',9,3],['Abie Farah',10,17],['David Franco',9,18],['Jacob Guindi',10,97],['Eli Halabi',9,10],['Ralph Hamra',10,22],['Ray Nachum',9,11],['Morris Novick',10,71],['Gabe Solomon',10,99],['Ezra Yedid',10,8],['Bobby Zamir',10,88,'G']].map(([name,grade,num,pos])=>({name,grade,num,pos:pos||'S'}));
const jvSchedule=[['2026-11-11T20:00','SSLI','Away'],['2026-11-16T19:15','RAMBAM','Home'],['2026-11-22T18:30','MTA','Home'],['2026-12-01T20:00','FLATBUSH','Home'],['2026-12-02T19:00','FLATBUSH','Away'],['2026-12-17T19:15','HAFTR','Home'],['2026-12-23T19:30','FRISCH','Away'],['2026-12-26T20:15','TABC','Home'],['2027-02-03T19:15','DRS','Away']].map(([date,opponent,site],i)=>({id:i+1,date,opponent,site,events:[],final:false,oppGoals:0,goalie:null}));
// Nine games are visible in the supplied schedule images.
const varsityRoster=[['Alan Chakkalo',12,31,'G'],['Eddie Dweck',11,21],['Isaac Dweck',12,12],['Jacob Esses',11,10],['Alan Fallas',12,17],['Steven Franco',12,61],['Abie Gindi',11,27],['Benny Hadriye',12,24],['Judah Marcos',12,63],['Moshe Nachum',12,7],['Rafael Sarway',12,36],['Judah Shalom',12,15],['Abraham Shammah',11,25],['Ray Swed',11,93],['Bobby Tawil',11,66]].map(([name,grade,num,pos])=>({name,grade,num,pos:pos||'S'}));
const varsitySchedule=[
['2026-11-16T12:00','RAMBAM','Home','DH Game 2'],['2026-11-19T20:00','HANC','Home'],['2026-11-21T20:00','JEC','Home'],['2026-11-24T19:00','MTA','Home'],['2026-11-30T19:30','FLATBUSH','Home'],['2026-12-14T19:30','FLATBUSH','Away'],['2026-12-17T12:00','HAFTR','Home','DH Game 2'],['2026-12-19T20:30','TABC','Home'],['2026-12-23T12:00','FRISCH','Away','DH Game 2'],['2026-12-28T20:00','NORTH SHORE (NSHA)','Away'],['2027-01-06T20:30','KUSHNER','Away'],['2027-02-03T12:00','DRS','Away','DH Game 2']
].map(([date,opponent,site,note],i)=>({id:i+1,date,opponent,site,note:note||'',events:[],final:false,oppGoals:0,goalie:null,oppEvents:[]}));
let team=localStorage.getItem('yde-current-team')==='Varsity'?'Varsity':'JV';
let roster,schedule,KEY,state,selected;function saveInit(){localStorage.setItem(KEY,JSON.stringify(state))}
function initTeam(){roster=team==='JV'?jvRoster:varsityRoster;schedule=team==='JV'?jvSchedule:varsitySchedule;KEY=team==='JV'?'yde-jv-tracker-v1':'yde-varsity-tracker-v1';try{state=JSON.parse(localStorage.getItem(KEY))}catch{state=null}if(!state||!Array.isArray(state.games))state={games:structuredClone(schedule),active:1};for(const g of state.games){g.events??=[];g.oppGoals??=0;g.final??=false;g.goalie??=null;g.oppEvents??=[];g.unassignedGoals??=0}
if(team==='JV'){
 const historic=[{id:101,date:'2026-11-05T19:00',opponent:'SAR',site:'Home',note:'Final · 3–7',unassignedGoals:3,oppGoals:7}];
 for(const h of historic){if(!state.games.some(g=>g.opponent===h.opponent&&g.date.slice(0,10)===h.date.slice(0,10)))state.games.push({...h,events:[],oppEvents:[],final:true,goalie:null})}
 state.games.sort((a,b)=>a.date.localeCompare(b.date));
}
if(team==='Varsity'){
 const historic=[{id:101,date:'2026-11-05T19:00',opponent:'SAR',site:'Home',note:'Final · 4–9',unassignedGoals:4,oppGoals:9},{id:102,date:'2026-11-09T19:00',opponent:'RAMAZ',site:'Home',note:'Final · 7–3',unassignedGoals:7,oppGoals:3}];
 for(const h of historic){if(!state.games.some(g=>g.opponent===h.opponent&&g.date.slice(0,10)===h.date.slice(0,10)))state.games.push({...h,events:[],oppEvents:[],final:true,goalie:31})}
 state.games.sort((a,b)=>a.date.localeCompare(b.date));
}
selected=state.games.some(g=>g.id===state.active)?state.active:state.games[0].id;saveInit();}
initTeam();let tab='dashboard';
function switchTeam(next){if(next===team)return;team=next;localStorage.setItem('yde-current-team',team);initTeam();tab='dashboard';render()}
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state))};
const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const datefmt=d=>new Date(d).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});const gameDate=g=>g.note?new Date(g.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' · '+g.note:datefmt(g.date);const game=id=>state.games.find(g=>g.id==id);const goals=g=>(g.unassignedGoals||0)+g.events.filter(e=>e.type==='goal').length;const stats=(p)=>{let gs=0,a=0,s=0,sv=0,ga=0,played=0,w=0,l=0,t=0;for(const g of state.games){gs+=g.events.filter(e=>e.type==='goal'&&e.player===p.num).length;a+=g.events.filter(e=>e.type==='assist'&&e.player===p.num).length;s+=g.events.filter(e=>e.type==='shot'&&e.player===p.num).length+g.events.filter(e=>e.type==='goal'&&e.player===p.num).length;sv+=g.events.filter(e=>e.type==='save'&&e.player===p.num).length;if(g.final){if(p.pos==='G'&&g.goalie===p.num){played++;ga+=g.oppGoals;let diff=goals(g)-g.oppGoals;if(diff>0)w++;else if(diff<0)l++;else t++}else if(p.pos!=='G'&&g.events.some(e=>e.player===p.num))played++}}return{gs,a,s,sv,ga,played,w,l,t,pts:gs+a}};
function tabs(){el('tabs').innerHTML=[['dashboard','Dashboard'],['live','Game Tracker'],['players','Players'],['bygame','By Game'],['schedule','Schedule'],['settings','Data & Settings']].map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')};function go(t){tab=t;render()};function render(){el('teamLabel').textContent=team;el('jvSwitch').classList.toggle('active',team==='JV');el('varsitySwitch').classList.toggle('active',team==='Varsity');tabs();el('view').innerHTML=({dashboard:dashboard,live:live,players:players,bygame:byGame,schedule:gamesList,settings:settings})[tab]()};function record(){let w=0,l=0,t=0;state.games.filter(g=>g.final).forEach(g=>{let d=goals(g)-g.oppGoals;d>0?w++:d<0?l++:t++});return{w,l,t}};
function dashboard(){const r=record(),all=roster.filter(p=>p.pos!=='G').map(p=>({...p,...stats(p)})).sort((a,b)=>b.pts-a.pts||b.gs-a.gs);const next=state.games.find(g=>!g.final);return `<div class="cards"><div class="metric"><strong>${r.w}-${r.l}-${r.t}</strong><span>Team record (W-L-T)</span></div><div class="metric"><strong>${state.games.filter(g=>g.final).length}/${state.games.length}</strong><span>Games completed</span></div><div class="metric"><strong>${state.games.reduce((n,g)=>n+goals(g),0)}</strong><span>Goals scored</span></div><div class="metric"><strong>${state.games.reduce((n,g)=>n+g.oppGoals,0)}</strong><span>Goals allowed</span></div></div><div class="grid" style="margin-top:16px"><div class="panel"><h2>Next game</h2>${next?`<h3>YDE ${next.site==='Home'?'vs':'@'} ${next.opponent}</h3><p>${gameDate(next)} · ${next.site}</p><button class="primary" onclick="openGame(${next.id})">Track game</button>`:'<p>All games completed</p>'}</div><div class="panel"><h2>Points leaders</h2><div class="tablewrap"><table><tr><th>Player</th><th>G</th><th>A</th><th>PTS</th></tr>${all.slice(0,5).map(p=>`<tr><td>#${p.num} ${esc(p.name)}</td><td>${p.gs}</td><td>${p.a}</td><td><b>${p.pts}</b></td></tr>`).join('')}</table></div></div></div><div class="panel"><h2>Recent games</h2>${state.games.filter(g=>g.final).slice(-4).reverse().map(gameRow).join('')||'<p class="muted">No completed games yet. Select Game Tracker to get started.</p>'}</div>`}
function gameRow(g){return `<div class="game"><div><strong>${g.site==='Home'?'YDE vs '+g.opponent:'YDE @ '+g.opponent}</strong><small>${gameDate(g)} · ${g.site}</small></div><div>${g.final?`<b>${goals(g)}–${g.oppGoals}</b>`:'<span class="tag">Upcoming</span>'}</div><button onclick="openGame(${g.id})">${g.final?'Review':'Track'}</button></div>`}function gamesList(){return `<div class="panel"><h2>Season schedule</h2>${state.games.map(gameRow).join('')}</div>`}function openGame(id){selected=id;state.active=id;save();go('live')}
function playerOptions(goalie=false,includeNone=false){return `${includeNone?'<option value="">None</option>':''}${roster.filter(p=>goalie?p.pos==='G':p.pos!=='G').map(p=>`<option value="${p.num}">#${p.num} ${esc(p.name)}</option>`).join('')}`}
function live(){const g=game(selected)||state.games[0];return `<div class="panel"><div class="field"><label>Choose game</label><select style="width:100%" onchange="openGame(+this.value)">${state.games.map(x=>`<option value="${x.id}" ${x.id===g.id?'selected':''}>${gameDate(x)} — ${x.site==='Home'?'vs':'@'} ${x.opponent}${x.final?' ✓':''}</option>`).join('')}</select></div><div class="score">YDE ${goals(g)} : ${g.oppGoals} ${esc(g.opponent)}</div><p class="muted" style="text-align:center">${g.site} · ${g.final?'Final':'Not finalized'}</p><div class="grid"><div><label>Opponent goals</label><div class="row"><button onclick="opGoal(-1)">− Undo</button><strong style="text-align:center">${g.oppGoals}</strong><button class="primary" onclick="opGoal(1)">🥅 + Opponent Goal</button></div><p class="status">No opposing player name needed. Each tap adds one goal to their score.</p></div><div><label>Starting/credited goalie</label><select style="width:100%" onchange="setGoalie(this.value)"><option value="">Choose goalie</option>${roster.filter(p=>p.pos==='G').map(p=>`<option value="${p.num}" ${g.goalie===p.num?'selected':''}>#${p.num} ${esc(p.name)}</option>`).join('')}</select></div></div></div><div class="panel"><h2>Historical / unassigned YDE goals</h2><p class="muted">For games already played, enter the final YDE score here when you do not yet know the individual scorers. You can assign goals to players below and lower this number accordingly. The scoreboard combines assigned and unassigned goals.</p><div class="row"><div><label>Goals not yet assigned to a player</label><input type="number" min="0" step="1" value="${g.unassignedGoals||0}" onchange="setUnassignedGoals(this.value)" style="width:100%"></div><div><label>Assigned player goals</label><strong>${g.events.filter(e=>e.type==='goal').length}</strong></div></div></div><div class="grid"><div class="panel"><h2>Quick stat entry</h2><div class="field"><label>Skater</label><select id="skater" style="width:100%">${playerOptions()}</select></div><div class="quick"><button onclick="add('goal')">🥅<b>+ Goal</b></button><button onclick="add('assist')">🏒<b>+ Assist</b></button><button onclick="add('shot')">🎯<b>+ Shot</b></button><button onclick="add('penalty')">⏱<b>+ Penalty</b></button><button onclick="add('block')">🛡<b>+ Block</b></button><button onclick="add('takeaway')">↗<b>+ Takeaway</b></button></div><p class="status">Goals automatically count as shots. Select a player, then tap a stat.</p><div class="field"><label>Goalie saves (select goalie)</label><select id="goalie" style="width:100%">${playerOptions(true)}</select></div><button class="primary" style="width:100%" onclick="add('save')">🧤 + Save</button></div><div class="panel"><h2>Game event log</h2><h3>Opponent scoring</h3>${g.oppEvents.length?g.oppEvents.slice().reverse().map((e,i)=>`<div class="event"><span><b>🥅 ${esc(g.opponent)} goal</b><br><small class="muted">${esc(e.time||'')}</small></span><button class="danger" onclick="removeOppEvent(${g.oppEvents.length-1-i})">Undo</button></div>`).join(''):`<p class="muted">${g.oppGoals?g.oppGoals+' opponent goal(s) from earlier tracking':'No opponent goals recorded.'}</p>`}<h3>YDE player events</h3>${g.events.length?g.events.slice().reverse().map((e,i)=>`<div class="event"><span><b>${esc(e.type.toUpperCase())}</b> · ${esc(roster.find(p=>p.num===e.player)?.name||'Unknown')}<br><small class="muted">${esc(e.time||'')}</small></span><button class="danger" onclick="removeEvent(${g.events.length-1-i})">Undo</button></div>`).join(''):'<p class="muted">No events recorded yet.</p>'}<hr style="border:0;border-top:1px solid #e8eef2"><div class="controls"><button class="${g.final?'':'primary'}" onclick="toggleFinal()">${g.final?'Reopen game':'Mark game final'}</button><button onclick="if(confirm('Clear all events and score for this game?'))clearGame()" class="danger">Reset game</button></div></div></div>`}
function setUnassignedGoals(v){const n=Number(v);if(!Number.isInteger(n)||n<0){alert('Enter a whole number of goals');render();return}game(selected).unassignedGoals=n;save();render()}function add(type){const g=game(selected),sel=el(type==='save'?'goalie':'skater');if(!sel)return;const player=+sel.value;g.events.push({type,player,time:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})});save();render()};function opGoal(n){const g=game(selected);if(n>0){g.oppGoals++;g.oppEvents.push({time:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})})}else if(g.oppGoals>0){g.oppGoals--;g.oppEvents.pop()}save();render()};function removeOppEvent(i){const g=game(selected);g.oppEvents.splice(i,1);g.oppGoals=Math.max(0,g.oppGoals-1);save();render()};function setGoalie(v){game(selected).goalie=v?+v:null;save();render()};function removeEvent(i){game(selected).events.splice(i,1);save();render()};function toggleFinal(){game(selected).final=!game(selected).final;save();render()};function clearGame(){const g=game(selected);g.events=[];g.unassignedGoals=0;g.oppGoals=0;g.oppEvents=[];g.final=false;g.goalie=null;save();render()};
function players(){const list=roster.map(p=>({...p,...stats(p)}));return `<div class="panel"><h2>Skater statistics</h2><p class="muted">G = goals · A = assists · PTS = points · SOG = shots on goal · PIM = penalty minutes (1:30 per penalty)</p><div class="tablewrap"><table><tr><th>Player</th><th>Grade</th><th>G</th><th>A</th><th>PTS</th><th>SOG</th><th>PIM*</th><th>BLK</th><th>TK</th></tr>${list.filter(p=>p.pos!=='G').sort((a,b)=>b.pts-a.pts).map(p=>`<tr><td><b>#${p.num} ${esc(p.name)}</b></td><td>${p.grade}</td><td>${p.gs}</td><td>${p.a}</td><td><b>${p.pts}</b></td><td>${p.s}</td><td>${(state.games.reduce((n,g)=>n+g.events.filter(e=>e.player===p.num&&e.type==='penalty').length,0)*1.5).toFixed(1)}</td><td>${state.games.reduce((n,g)=>n+g.events.filter(e=>e.player===p.num&&e.type==='block').length,0)}</td><td>${state.games.reduce((n,g)=>n+g.events.filter(e=>e.player===p.num&&e.type==='takeaway').length,0)}</td></tr>`).join('')}</table></div><p class="muted">*Each penalty is 1 minute 30 seconds (1.5 PIM).</p></div><div class="panel"><h2>Goalie statistics</h2><div class="tablewrap"><table><tr><th>Goalie</th><th>W</th><th>L</th><th>T</th><th>Saves</th><th>GA</th><th>SV%</th></tr>${list.filter(p=>p.pos==='G').map(p=>`<tr><td><b>#${p.num} ${esc(p.name)}</b></td><td>${p.w}</td><td>${p.l}</td><td>${p.t}</td><td>${p.sv}</td><td>${p.ga}</td><td>${p.sv+p.ga?(100*p.sv/(p.sv+p.ga)).toFixed(1)+'%':'—'}</td></tr>`).join('')}</table></div><p class="muted">Goalie GA and decisions are credited to the selected goalie for each finalized game. This assumes one goalie per game.</p></div>`}
function byGame(){const g=game(selected)||state.games[0];const skaters=roster.filter(p=>p.pos!=='G').map(p=>{const ev=g.events.filter(e=>e.player===p.num);const count=t=>ev.filter(e=>e.type===t).length;return {...p,g:count('goal'),a:count('assist'),shots:count('shot')+count('goal'),pen:count('penalty'),blocks:count('block'),take:count('takeaway')}});const keep=skaters.filter(p=>p.g+p.a+p.shots+p.pen+p.blocks+p.take>0).sort((a,b)=>(b.g+b.a)-(a.g+a.a)||b.g-a.g);return `<div class="panel"><h2>Stats by Game</h2><div class="field"><label>Select a matchup</label><select style="width:100%" onchange="selected=+this.value;state.active=selected;save();render()">${state.games.map(x=>`<option value="${x.id}" ${x.id===g.id?'selected':''}>${gameDate(x)} — ${x.site==='Home'?'vs':'@'} ${esc(x.opponent)}</option>`).join('')}</select></div><div class="score">YDE ${goals(g)} : ${g.oppGoals} ${esc(g.opponent)}</div><p class="muted" style="text-align:center">${gameDate(g)} · ${g.site} · ${g.final?'Final':'Not finalized'} · ${g.unassignedGoals||0} YDE goals not assigned to players</p><div class="controls"><button class="primary" onclick="openGame(${g.id})">Edit this game's stats</button></div></div><div class="panel"><h2>YDE player stats — this game</h2><div class="tablewrap"><table><tr><th>Player</th><th>G</th><th>A</th><th>PTS</th><th>SOG</th><th>PIM</th><th>BLK</th><th>TK</th></tr>${(keep.length?keep:[]).map(p=>`<tr><td><b>#${p.num} ${esc(p.name)}</b></td><td>${p.g}</td><td>${p.a}</td><td><b>${p.g+p.a}</b></td><td>${p.shots}</td><td>${(p.pen*1.5).toFixed(1)}</td><td>${p.blocks}</td><td>${p.take}</td></tr>`).join('')}</table></div>${!keep.length?'<p class="muted">No player stats entered for this game yet.</p>':''}</div><div class="grid"><div class="panel"><h2>Opponent scoring</h2><p><strong style="font-size:28px">${g.oppGoals}</strong> goals by ${esc(g.opponent)}</p><p class="muted">No individual opponent scorer required.</p>${g.oppEvents.length?g.oppEvents.map((e,i)=>`<div class="event"><span>Goal ${i+1}</span><span>${esc(e.time||'')}</span></div>`).join(''):''}<button onclick="openGame(${g.id})">Record opponent goal</button></div><div class="panel"><h2>Goalie stats — this game</h2>${roster.filter(p=>p.pos==='G').map(p=>{const saves=g.events.filter(e=>e.type==='save'&&e.player===p.num).length;const credited=g.goalie===p.num;return `<div class="event"><span><b>#${p.num} ${esc(p.name)}</b>${credited?' · Credited goalie':''}</span><span>${saves} saves${credited?' · '+g.oppGoals+' GA':''}</span></div>`}).join('')}<p class="muted">Goals allowed are assigned to the credited goalie.</p></div></div>`}
function settings(){return `<div class="panel"><h2>Export and restore</h2><p>Download an Excel workbook for the selected team for reports and sharing. Keep a JSON backup for restoring data into this app. JV and Varsity stats are saved separately and automatically in this browser on this device. Export backups regularly; clearing browser data can erase local stats.</p><div class="controls"><button class="primary" onclick="exportExcel()">Download Excel (.xlsx)</button><button onclick="exportData()">Export JSON backup (restore file)</button><label style="background:#e8f0f6;border-radius:10px;padding:12px;cursor:pointer">Import backup <input type="file" accept="application/json" onchange="importData(this)" style="display:none"></label></div></div><div class="panel"><h2>Roster</h2><div class="tablewrap"><table><tr><th>Number</th><th>Name</th><th>Grade</th><th>Position</th></tr>${roster.map(p=>`<tr><td>#${p.num}</td><td>${esc(p.name)}</td><td>${p.grade}</td><td>${p.pos==='G'?'Goalie':'Skater'}</td></tr>`).join('')}</table></div></div><div class="panel"><h2>Important notes</h2><p class="notice">Data is stored locally, not synced across devices. Save a backup after games. For multi-device syncing or coach accounts, a hosted database would be needed.</p><button class="danger" onclick="if(confirm('Delete ALL '+team+' tracked stats? This cannot be undone.')){state={games:structuredClone(schedule),active:1};save();go('dashboard')}">Erase all stats</button></div>`}
function exportExcel(){
 const count=(g,num,type)=>g.events.filter(e=>e.player===num&&e.type===type).length;
 const season=[['Number','Player','Grade','Goals','Assists','Points','Shots on Goal','PIM (minutes; 1:30 per penalty)','Blocks','Takeaways']];
 for(const p of roster.filter(p=>p.pos!=='G')){const x=stats(p);season.push([p.num,p.name,p.grade,x.gs,x.a,x.pts,x.s,state.games.reduce((n,g)=>n+count(g,p.num,'penalty'),0)*1.5,state.games.reduce((n,g)=>n+count(g,p.num,'block'),0),state.games.reduce((n,g)=>n+count(g,p.num,'takeaway'),0)])}
 const goalie=[['Number','Goalie','Grade','Wins','Losses','Ties','Saves','Goals Allowed','Save Percentage']];
 for(const p of roster.filter(p=>p.pos==='G')){const x=stats(p);goalie.push([p.num,p.name,p.grade,x.w,x.l,x.t,x.sv,x.ga,x.sv+x.ga?Number((x.sv/(x.sv+x.ga)).toFixed(4)):''])}
 const results=[['Date','Opponent','Home/Away','Status','YDE Goals','Opponent Goals','Result','Credited Goalie']];
 const bygame=[['Date','Opponent','Home/Away','Player #','Player','Goals','Assists','Points','Shots on Goal','PIM (minutes; 1:30 per penalty)','Blocks','Takeaways','Goalie Saves']];
 const events=[['Date','Opponent','Team','Player #','Player','Event','Recorded Time']];
 for(const g of state.games){const d=g.date.slice(0,10),diff=goals(g)-g.oppGoals;results.push([d,g.opponent,g.site,g.final?'Final':'Not final',goals(g),g.oppGoals,g.final?(diff>0?'Win':diff<0?'Loss':'Tie'):'',roster.find(p=>p.num===g.goalie)?.name||'']);for(const p of roster){const n=t=>count(g,p.num,t),gl=n('goal'),as=n('assist');bygame.push([d,g.opponent,g.site,p.num,p.name,gl,as,gl+as,n('shot')+gl,n('penalty')*1.5,n('block'),n('takeaway'),n('save')])}for(const e of g.events){events.push([d,g.opponent,'YDE',e.player,roster.find(p=>p.num===e.player)?.name||'',e.type,e.time||''])}for(let i=0;i<g.oppGoals;i++){events.push([d,g.opponent,g.opponent,'','','goal',g.oppEvents?.[i]?.time||''])}}
 const sheets=[['Season Stats',season],['Goalie Stats',goalie],['Game Results',results],['Stats by Game',bygame],['Game Events',events]];
 const xmlEsc=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
 const col=i=>{let x='';for(i++;i;i=Math.floor((i-1)/26))x=String.fromCharCode(65+(i-1)%26)+x;return x};
 const sheetXml=rows=>'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetData>'+rows.map((row,r)=>'<row r="'+(r+1)+'">'+row.map((v,c)=>{const ref=col(c)+(r+1);return typeof v==='number'&&Number.isFinite(v)?'<c r="'+ref+'"'+(r===0?' s="1"':'')+'><v>'+v+'</v></c>':'<c r="'+ref+'" t="inlineStr"'+(r===0?' s="1"':'')+'><is><t>'+xmlEsc(v??'')+'</t></is></c>'}).join('')+'</row>').join('')+'</sheetData><autoFilter ref="A1:'+col(rows[0].length-1)+rows.length+'"/></worksheet>';
 const files=[['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>'],['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map(([name],i)=>'<sheet name="'+xmlEsc(name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>'],['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],['xl/styles.xml','<?xml version="1.0" encoding="UTF-8"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF092C48"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="1" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs></styleSheet>'],...sheets.map(([_,rows],i)=>['xl/worksheets/sheet'+(i+1)+'.xml',sheetXml(rows)])];
 const enc=new TextEncoder(),parts=[],central=[];let offset=0;const crcTable=Array.from({length:256},(_,n)=>{for(let j=0;j<8;j++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0});const crc32=bytes=>{let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0};const put16=(dv,o,v)=>dv.setUint16(o,v,true),put32=(dv,o,v)=>dv.setUint32(o,v,true);
 for(const [name,content] of files){const nameBytes=enc.encode(name),bytes=enc.encode(content),crc=crc32(bytes);const local=new Uint8Array(30+nameBytes.length),ld=new DataView(local.buffer);put32(ld,0,0x04034b50);put16(ld,4,20);put16(ld,6,0x0800);put32(ld,14,crc);put32(ld,18,bytes.length);put32(ld,22,bytes.length);put16(ld,26,nameBytes.length);local.set(nameBytes,30);parts.push(local,bytes);const dir=new Uint8Array(46+nameBytes.length),dd=new DataView(dir.buffer);put32(dd,0,0x02014b50);put16(dd,4,20);put16(dd,6,20);put16(dd,8,0x0800);put32(dd,16,crc);put32(dd,20,bytes.length);put32(dd,24,bytes.length);put16(dd,28,nameBytes.length);put32(dd,42,offset);dir.set(nameBytes,46);central.push(dir);offset+=local.length+bytes.length}
 const centralSize=central.reduce((n,x)=>n+x.length,0),end=new Uint8Array(22),ed=new DataView(end.buffer);put32(ed,0,0x06054b50);put16(ed,8,files.length);put16(ed,10,files.length);put32(ed,12,centralSize);put32(ed,16,offset);const blob=new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='YDE_'+team.replace(' ','_')+'_Hockey_Stats.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)
}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='yde-'+team.toLowerCase()+'-hockey-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(inp){const file=inp.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.games)||!data.games.every(g=>Array.isArray(g.events)&&typeof g.id==='number'))throw Error('Invalid backup');if(!confirm('Replace all '+team+' stats with this backup? Only the selected team will be affected.'))return;state=data;save();render()}catch(e){alert('Could not import: '+e.message)}}render();
</script></body></html>
